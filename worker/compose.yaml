services:
  social-worker:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SOCIAL_WORKER_TOKEN: ${SOCIAL_WORKER_TOKEN:?Configure a server secret of at least 32 characters}
      WORKER_SOURCE_CATALOG: ${WORKER_SOURCE_CATALOG:-[]}
      WORKER_TIMEOUT_SECONDS: "18"
    shm_size: 512mb
    mem_limit: 2g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
