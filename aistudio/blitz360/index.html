    <meta charset="UTF-8" />

    <meta name="description" content="Plataforma de inteligência comercial, prospecção e captação de clientes B2B & B2C, OSINT corporativo, calculadora CIF/FOB e scripts de WhatsApp." />
    <meta property="og:title" content="Blitz 360 PRO | Prospecção & Inteligência de Vendas B2B/B2C" />
    <meta property="og:description" content="Plataforma de inteligência comercial, prospecção e captação de clientes B2B & B2C, OSINT corporativo, calculadora CIF/FOB e scripts de WhatsApp." />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M13 2L3 14h9l-1 8 10-12h-9l1-8z'/></svg>" />
    <script>
      // Suppress Vite HMR WebSocket connection errors (HMR is disabled in AI Studio iFrame environment)
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && (
          String(event.reason.message || '').includes('WebSocket') ||
          String(event.reason.message || '').includes('closed without opened') ||
          String(event.reason).includes('WebSocket')
        )) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (event && (
          String(event.message || '').includes('WebSocket') ||
          String(event.filename || '').includes('@vite/client')
        )) {
          event.preventDefault();
        }
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>

    <script type="module" src="/src/main.tsx"></script>
  </body>
